<body class="min-h-screen flex flex-col bg-[#f8fafc] text-slate-800">

    <header class="bg-[#1e2430] text-white sticky top-0 z-50 shadow-md">

                </div>
            </div>

            <!-- Правая часть: Языки, + Elan yerləşdir и Giriş (с выпадающим меню кабинета) -->
            <div class="flex items-center space-x-3">
                
                <!-- Переключатель языков -->
                <div class="hidden sm:flex bg-slate-800 rounded-lg p-0.5 border border-slate-700 text-xs font-bold">
                    <button type="button" onclick="setLanguage('az')" id="lang-az" class="px-2.5 py-1 rounded-md bg-[#e0533c] text-white transition">AZ</button>
                    <button type="button" onclick="setLanguage('ru')" id="lang-ru" class="px-2.5 py-1 rounded-md text-slate-400 hover:text-white transition">RU</button>
                </div>

                <!-- Красная кнопка + Elan yerləşdir -->
                <button type="button" onclick="switchTab('add-villa')" class="bg-[#e0533c] hover:bg-[#c9452f] text-white font-bold px-4 py-2 rounded-lg text-xs sm:text-sm flex items-center space-x-1.5 shadow transition">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span id="t-btn-new-ad">Elan yerləşdir</span>
                </button>

                <!-- Кнопка Giriş / Профиль с выпадающим списком -->
                <div class="relative" id="giris-dropdown-container">
                    <button type="button" onclick="toggleProfileDropdown()" class="bg-[#2d3545] hover:bg-[#394357] border border-slate-600/80 text-white font-semibold px-3.5 py-2 rounded-lg text-xs sm:text-sm flex items-center space-x-2 transition">
                        <i class="fa-regular fa-user"></i>
                        <span id="t-btn-login">Giriş</span>
                        <i id="profile-chevron" class="fa-solid fa-chevron-down text-[10px] text-slate-300 transition-transform duration-200"></i>
                    </button>

                    <!-- Выпадающее окошко при клике на Giriş -->
                    <div id="profile-dropdown" class="hidden absolute right-0 mt-2 w-64 bg-white text-slate-800 rounded-2xl shadow-2xl border border-slate-200 p-4 z-50 space-y-3">
                        <div class="flex items-center space-x-3 border-b border-slate-100 pb-3">
                            <div class="w-10 h-10 rounded-full bg-slate-700 text-white flex items-center justify-center text-lg shrink-0">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <div class="overflow-hidden">
                                <div class="font-extrabold text-sm text-slate-900">(055) 350-78-87</div>
                                <div class="text-xs font-bold text-slate-500 truncate">lion131983@mail.ru</div>
                            </div>
                        </div>
                        <div class="space-y-1 text-sm font-medium text-slate-700">
                            <button type="button" onclick="openCabinetSubtab('main'); closeAllDropdowns();" class="w-full text-left px-3 py-2 rounded-xl hover:bg-slate-100 transition flex items-center justify-between">
                                <span>Şəxsi kabinet</span>
                                <i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>
                            </button>
                            <button type="button" onclick="openCabinetSubtab('ads'); closeAllDropdowns();" class="w-full text-left px-3 py-2 rounded-xl hover:bg-slate-100 transition flex items-center justify-between">
                                <span>Elanlarım (1)</span>
                                <i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>
                            </button>
                            <button type="button" onclick="openCabinetSubtab('payments'); closeAllDropdowns();" class="w-full text-left px-3 py-2 rounded-xl hover:bg-slate-100 transition flex items-center justify-between">
                                <span>Ödəniş üsulu (Kartlarım)</span>
                                <i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>
                            </button>
                            <button type="button" onclick="openCabinetSubtab('history'); closeAllDropdowns();" class="w-full text-left px-3 py-2 rounded-xl hover:bg-slate-100 transition flex items-center justify-between">
                                <span>Əməliyyat tarixçəsi</span>
                                <i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>
                            </button>
                            <button type="button" onclick="openCabinetSubtab('profile'); closeAllDropdowns();" class="w-full text-left px-3 py-2 rounded-xl hover:bg-slate-100 transition flex items-center justify-between">
                                <span>Profil</span>
                                <i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>
                            </button>
                            <div class="border-t border-slate-100 my-1 pt-1">
                                <button type="button" onclick="switchTab('admin'); closeAllDropdowns();" class="w-full text-left px-3 py-2 rounded-xl hover:bg-amber-50 text-amber-700 font-bold transition flex items-center justify-between">
                                    <span>👑 Admin Panel (PIN: 7887)</span>
                                    <span id="pending-count-badge" class="hidden bg-red-500 text-white text-[10px] px-1.5 py-0.2 rounded-full">0</span>
                                </button>
                                <button type="button" onclick="switchTab('owner'); closeAllDropdowns();" class="w-full text-left px-3 py-2 rounded-xl hover:bg-cyan-50 text-cyan-700 font-bold transition block">
                                    💧 OXY POOL Hovuz Xloru
                                </button>
                            </div>
                            <button type="button" onclick="closeAllDropdowns(); switchTab('guest');" class="w-full text-left px-3 py-2 rounded-xl hover:bg-red-50 text-red-600 transition block">
                                Çıxış
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </header>

    <!-- ========================================================================= -->
    <!-- ПАНЕЛЬ ПОИСКА С ВЫПАДАЮЩИМ "QİYMƏT, ₼" (КАК НА BINA.AZ И ВАШЕМ ВИДЕО)     -->
    <!-- ========================================================================= -->
    <div id="search-bar-section" class="bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-3">
            
            <div class="flex flex-wrap items-center gap-2.5">
                
                <!-- 1. Bütün məkanlar -->
                <select id="filter-district" onchange="applySearchFilters()" class="bg-white border border-slate-300 hover:border-slate-400 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-700 focus:outline-none focus:border-blue-500 cursor-pointer">
                    <option value="all">Bütün məkanlar</option>
                    <option value="Novxanı">Novxanı</option>
                    <option value="Mərdəkan">Mərdəkan</option>
                    <option value="Şüvəlan">Şüvəlan</option>
                    <option value="Bilgəh">Bilgəh</option>
                    <option value="Zaqulba">Zaqulba</option>
                    <option value="Nardaran">Nardaran</option>
                    <option value="Qəbələ">Qəbələ</option>
                </select>

                <!-- 2. Günlük / Aylıq -->
                <select id="filter-period" onchange="applySearchFilters()" class="bg-white border border-slate-300 hover:border-slate-400 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-700 focus:outline-none focus:border-blue-500 cursor-pointer">
                    <option value="all">Günlük / Aylıq</option>
                    <option value="daily">Günlük</option>
                    <option value="monthly">Aylıq</option>
                </select>

                <!-- 3. Otaq sayı -->
                <select id="filter-rooms" onchange="applySearchFilters()" class="bg-white border border-slate-300 hover:border-slate-400 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-700 focus:outline-none focus:border-blue-500 cursor-pointer">
                    <option value="all">Otaq sayı</option>
                    <option value="2">2 otaqlı</option>
                    <option value="3">3 otaqlı</option>
                    <option value="4">4 otaqlı</option>
                    <option value="5">5 otaqlı</option>
                    <option value="6">6+ otaqlı</option>
                </select>

                <!-- 4. КНОПКА "Qiymət, ₼" С ВЫПАДАЮЩИМ ОКНОМ "min." и "maks." (ТОЧНО КАК НА ВИДЕО BINA.AZ) -->
                <div class="relative" id="price-dropdown-container">
                    <button type="button" onclick="togglePriceDropdown()" id="price-dropdown-btn" class="bg-white border border-slate-300 hover:border-slate-400 rounded-xl px-4 py-2.5 text-sm font-medium text-slate-700 flex items-center space-x-3 focus:outline-none focus:border-blue-500 transition min-w-[145px] justify-between">
                        <span id="price-btn-label">Qiymət, ₼</span>
                        <i id="price-chevron" class="fa-solid fa-chevron-down text-xs text-slate-500 transition-transform duration-200"></i>
                    </button>

                    <!-- Выпадающая панель с полями min. и maks. -->
                    <div id="price-dropdown-panel" class="hidden absolute left-0 mt-2 w-72 bg-white rounded-2xl shadow-xl border border-slate-200 p-3.5 z-50">
                        <div class="grid grid-cols-2 gap-2.5">
                            <div class="relative">
                                <input type="number" id="filter-price-min" oninput="onPriceInput()" placeholder="min." class="w-full bg-white border border-slate-300 focus:border-blue-500 rounded-xl px-3 py-2 text-sm text-slate-800 focus:outline-none">
                            </div>
                            <div class="relative">
                                <input type="number" id="filter-price-max" oninput="onPriceInput()" placeholder="maks." class="w-full bg-white border border-slate-300 focus:border-blue-500 rounded-xl px-3 py-2 text-sm text-slate-800 focus:outline-none">
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Кнопка Sıfırla справа -->
            <div>
                <button type="button" onclick="resetSearchFilters()" id="t-btn-
