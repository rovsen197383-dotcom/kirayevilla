<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>kirayevilla.com — Həyət evləri və bağ evləri kirayə</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f7f5;
            color: #2b2b2b;
            -webkit-tap-highlight-color: transparent;
        }
        .header-bg {
            background-color: #262523;
        }
        .btn-accent {
            background-color: #a486b0;
            transition: background-color 0.2s;
        }
        .btn-accent:hover {
            background-color: #8f709c;
        }
        .toast-enter {
            animation: slideDown 0.3s ease-out forwards;
        }
        @keyframes slideDown {
            from { transform: translate(-50%, -100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ВСПЛЫВАЮЩЕЕ УВЕДОМЛЕНИЕ С КОДОМ -->
    <div id="toastNotification" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] hidden bg-stone-900 text-white px-6 py-4 rounded-xl shadow-2xl border border-purple-400 flex items-center gap-4 min-w-[300px]">
        <div class="bg-purple-600/30 p-2.5 rounded-lg text-purple-300">
            <i class="fa-solid fa-bell text-xl"></i>
        </div>
        <div>
            <div id="toastTitle" class="text-xs text-stone-400">Bildiriş</div>
            <div id="toastMessage" class="text-sm font-semibold mt-0.5">Kod göndərildi</div>
        </div>
    </div>

    <!-- ШАПКА САЙТА (HEADER) -->
    <header class="header-bg text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="#" class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-lg bg-[#e07a5f] flex items-center justify-center font-bold text-lg shadow-inner">
                    K
                </div>
                <div>
                    <div class="font-bold text-lg leading-tight tracking-tight">kirayevilla<span class="text-[#e07a5f]">.com</span></div>
                    <div class="text-[11px] text-stone-400">Həyət evləri və bağ evləri</div>
                </div>
            </a>

            <div class="flex items-center gap-2.5">
                <button onclick="handleNewListingClick()" class="bg-[#e07a5f] hover:bg-[#d0694e] text-white text-xs sm:text-sm font-medium px-3.5 py-2 rounded-lg transition flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-plus"></i>
                    <span>Elan yerləşdir</span>
                </button>

                <button id="authHeaderBtn" onclick="handleAuthButtonClick()" class="bg-stone-700 hover:bg-stone-600 text-stone-200 text-xs sm:text-sm font-medium px-3.5 py-2 rounded-lg transition flex items-center gap-1.5">
                    <i class="fa-regular fa-user"></i>
                    <span id="authHeaderText">Giriş</span>
                </button>
            </div>
        </div>
    </header>

    <!-- ПАНЕЛЬ ФИЛЬТРОВ -->
    <section class="bg-white border-b border-stone-200 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3">
            <div class="flex flex-wrap items-center gap-2 sm:gap-3">
                <select id="filterLocation" onchange="applyFilters()" class="border border-stone-300 rounded-lg px-3 py-2 text-xs sm:text-sm bg-white text-stone-700 focus:outline-none focus:border-purple-500">
                    <option value="">Bütün məkanlar</option>
                    <option value="Novxanı">Novxanı</option>
                    <option value="Mərdəkan">Mərdəkan</option>
                    <option value="Şüvəlan">Şüvəlan</option>
                    <option value="Bilgəh">Bilgəh</option>
                    <option value="Zaqulba">Zaqulba</option>
                    <option value="Qəbələ">Qəbələ</option>
                    <option value="Şamaxı">Şamaxı</option>
                    <option value="Quba">Quba</option>
                </select>

                <select id="filterType" onchange="applyFilters()" class="border border-stone-300 rounded-lg px-3 py-2 text-xs sm:text-sm bg-white text-stone-700 focus:outline-none focus:border-purple-500">
                    <option value="">Günlük / Aylıq</option>
                    <option value="gün">Günlük</option>
                    <option value="ay">Aylıq</option>
                </select>

                <select id="filterRooms" onchange="applyFilters()" class="border border-stone-300 rounded-lg px-3 py-2 text-xs sm:text-sm bg-white text-stone-700 focus:outline-none focus:border-purple-500">
                    <option value="">Otaq sayı</option>
                    <option value="1">1 otaqlı</option>
                    <option value="2">2 otaqlı</option>
                    <option value="3">3 otaqlı</option>
                    <option value="4">4 otaqlı</option>
                    <option value="5">5+ otaqlı</option>
                </select>

                <div class="flex items-center gap-1.5">
                    <input id="filterMinPrice" oninput="applyFilters()" type="number" placeholder="min. ₼" class="w-20 sm:w-24 border border-stone-300 rounded-lg px-2.5 py-2 text-xs sm:text-sm focus:outline-none focus:border-purple-500">
                    <span class="text-stone-400">—</span>
                    <input id="filterMaxPrice" oninput="applyFilters()" type="number" placeholder="maks. ₼" class="w-20 sm:w-24 border border-stone-300 rounded-lg px-2.5 py-2 text-xs sm:text-sm focus:outline-none focus:border-purple-500">
                </div>

                <button onclick="resetFilters()" class="text-xs text-stone-500 hover:text-stone-800 underline ml-auto">
                    Sıfırla
                </button>
            </div>
        </div>
    </section>

    <!-- ОСНОВНОЙ КОНТЕНТ (СПИСОК ВИЛЛ) -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">
        <div class="mb-5">
            <h1 class="text-lg sm:text-xl font-bold text-stone-800">Həyət evləri / Bağ evləri kirayə</h1>
            <p id="listingsCount" class="text-xs text-stone-500 mt-0.5">1 elan tapıldı</p>
        </div>

        <div id="listingsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Карточки генерируются через JS -->
        </div>
    </main>

    <!-- МОДАЛЬНОЕ ОКНО ВХОДА (GİRİŞ: TELEFON & EMAIL) -->
    <div id="loginModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl relative">
            <button onclick="closeModal('loginModal')" class="absolute top-4 right-4 text-stone-400 hover:text-stone-700 w-8 h-8 flex items-center justify-center rounded-full hover:bg-stone-100">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <h2 class="text-lg font-bold text-stone-800 mb-1">Kabinetə giriş</h2>
            <p class="text-xs text-stone-500 mb-4">Elanları idarə etmək üçün daxil olun</p>

            <!-- Переключатель: Телефон или Email -->
            <div class="grid grid-cols-2 gap-1 bg-stone-100 p-1 rounded-xl mb-5">
                <button id="tabPhoneBtn" onclick="switchAuthMethod('phone')" class="py-2 text-xs font-semibold rounded-lg bg-white text-stone-800 shadow-xs transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-phone text-purple-600"></i>
                    <span>Telefon</span>
                </button>
                <button id="tabEmailBtn" onclick="switchAuthMethod('email')" class="py-2 text-xs font-semibold rounded-lg text-stone-500 hover:text-stone-800 transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-envelope text-purple-600"></i>
                    <span>Email</span>
                </button>
            </div>

            <!-- ШАГ 1: Ввод телефона или Email -->
            <div id="authStep1">
                <!-- Поле для Телефона -->
                <div id="phoneInputGroup" class="mb-4">
                    <label class="block text-xs font-medium text-stone-600 mb-1.5">Mobil nömrə</label>
                    <div class="flex">
                        <span class="inline-flex items-center px-3 rounded-l-xl border border-r-0 border-stone-300 bg-stone-50 text-stone-600 text-sm font-medium">
                            +994
                        </span>
                        <input id="loginPhoneInput" type="tel" placeholder="50 123 45 67" maxlength="12" class="w-full border border-stone-300 rounded-r-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-purple-500">
                    </div>
                </div>

                <!-- Поле для Email -->
                <div id="emailInputGroup" class="mb-4 hidden">
                    <label class="block text-xs font-medium text-stone-600 mb-1.5">E-poçt ünvanı</label>
                    <input id="loginEmailInput" type="email" placeholder="nümunə@mail.com" class="w-full border border-stone-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-purple-500">
                </div>

                <div id="authErrorMsg" class="text-xs text-red-600 mb-3 hidden"></div>

                <button id="sendCodeBtn" onclick="sendVerificationCode()" class="w-full btn-accent text-white font-semibold py-2.5 rounded-xl text-sm shadow-sm flex items-center justify-center gap-2">
                    <span>Kod göndər</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </div>

            <!-- ШАГ 2: Ввод полученного кода -->
            <div id="authStep2" class="hidden">
                <div class="bg-purple-50 border border-purple-200 rounded-xl p-3 mb-4 text-xs text-purple-900">
                    <span id="sentTargetText" class="font-semibold"></span> ünvanına 4 rəqəmli təsdiq kodu göndərildi.
                    <div class="mt-1 text-[11px] text-purple-700">
                        (Test rejimi kodu: <strong id="demoCodeHint" class="underline text-sm"></strong>)
                    </div>
                </div>

                <label class="block text-xs font-medium text-stone-600 mb-1.5">Təsdiq kodu</label>
                <input id="verificationCodeInput" type="text" maxlength="6" placeholder="• • • •" class="w-full border border-stone-300 rounded-xl px-3.5 py-2.5 text-center text-lg font-bold tracking-widest focus:outline-none focus:border-purple-500 mb-3">

                <div id="codeErrorMsg" class="text-xs text-red-600 mb-3 hidden"></div>

                <button onclick="verifyCodeAndLogin()" class="w-full btn-accent text-white font-semibold py-2.5 rounded-xl text-sm shadow-sm mb-2">
                    Təsdiqlə və Daxil ol
                </button>

                <button onclick="backToStep1()" class="w-full text-xs text-stone-500 hover:text-stone-800 py-1.5">
                    ← Geriyə qayıt
                </button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ ОБЪЯВЛЕНИЯ -->
    <div id="elanModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 hidden items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative my-8">
            <button onclick="closeModal('elanModal')" class="absolute top-4 right-4 text-stone-400 hover:text-stone-700 w-8 h-8 flex items-center justify-center rounded-full hover:bg-stone-100">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <h2 class="text-lg font-bold text-stone-800 mb-4">Yeni elan yerləşdir</h2>

            <div class="space-y-3.5">
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1">Məkan</label>
                    <select id="newMekan" class="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm bg-white">
                        <option value="Novxanı">Novxanı</option>
                        <option value="Mərdəkan">Mərdəkan</option>
                        <option value="Şüvəlan">Şüvəlan</option>
                        <option value="Bilgəh">Bilgəh</option>
                        <option value="Zaqulba">Zaqulba</option>
                        <option value="Qəbələ">Qəbələ</option>
                        <option value="Şamaxı">Şamaxı</option>
                        <option value="Quba">Quba</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-stone-600 mb-1">Otaq sayı</label>
                        <input id="newOtaq" type="number" value="3" min="1" class="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-stone-600 mb-1">Qonaq tutumu (nəfər)</label>
                        <input id="newNefer" type="number" value="6" min="1" class="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-stone-600 mb-1">Qiymət (₼)</label>
                        <input id="newPrice" type="number" placeholder="150" class="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-stone-600 mb-1">Müddət</label>
                        <select id="newPeriod" class="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm bg-white">
                            <option value="gün">Günlük</option>
                            <option value="ay">Aylıq</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1">Əlaqə nömrəsi</label>
                    <input id="newPhone" type="tel" placeholder="+994 50 123 45 67" class="w-full border border-stone-300 rounded-xl px-3 py-2 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1">Şəkil seçin</label>
                    <input id="newPhoto" type="file" accept="image/*" class="w-full text-xs text-stone-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100">
                </div>

                <button onclick="saveNewListing()" class="w-full bg-[#e07a5f] hover:bg-[#d0694e] text-white font-semibold py-2.5 rounded-xl text-sm shadow-sm mt-2">
                    Elanı dərc et
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. НАСТРОЙ
